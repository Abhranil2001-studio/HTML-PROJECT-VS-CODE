<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Register</legend>
            <label for="">Firstname:</label>
            <input type="text" name="fname" id="fname"><br><br>
            <label for="">Lastname:</label>
            <input type="text" name="lname" id="lname"><br><br>
            <label for="">Email:</label>
            <input type="email" name="email" id="email"><br><br>
            <label for="">Password:</label>
            <input type="password" name="password" id="password" placeholder="enter password"><br><br>
            <label for="">DOB</label>
            <input type="date" name="dob" id="dob"><br><br>
            <label for="">Phone Number:</label>
            <input type="tel" name="ph_no" id="ph_no"><br><br>
            <label for="">Address:</label>
            <textarea name="" id="" cols="30" rows="10"></textarea><br><br>
            <label for="">Gender</label>
            <input type="radio" name="Gender" id="Gender">Male
            <input type="radio" name="Gender" id="Gender">Female
            <input type="radio" name="Gender" id="Gender">Others <br><br>
            <label for="">Skills:</label>
            <input type="checkbox" name="skills" id="">java
            <input type="checkbox" name="skills" id="">python
            <input type="checkbox" name="skills" id="">sql <br><br>
            <label for="">CVs:</label>
            <input type="file" name="" id=""><br><br>
            <button type="submit">Register</button>
            <button type="reset">Refresh</button>


</fieldset>
    </form>
</body>
</html>
