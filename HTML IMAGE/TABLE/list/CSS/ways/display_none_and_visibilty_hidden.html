<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width: 400px;
            height: 400px;
            border: 2px solid red;
        }
        #sec{
            width: 400px;
            height: 400px;
            border: 2px solid black;
        }
        #a{
            width: 100px;
            height: 100px;
            background-color: blue;
            display: none;
        }
        #b{
            width: 100px;
            height: 100px;
            background-color: blue;
            display: none;
        }
        #c{
            width: 100px;
            height: 100px;
            background-color: brown;
        }
        #d{
            width: 100px;
            height: 100px;
            background-color: aqua;
        }
        #e{
            width: 100px;
            height: 100px;
            background-color: blue;
            visibility: hidden;
        }
        #f{
            width: 100px;
            height: 100px;
            background-color: brown;
        }
        body{
            display: flex;
        }
    </style>
</head>
<body>
    <div id="main">
        <main id="a"></main>
        <article id="b"></article>
        <aside id="c"></aside>

    </div>
    <div id="sec">
        <main id="d"></main>
        <article id="e"></article>
        <aside id="f"></aside>
    </div>
</body>
</html>
