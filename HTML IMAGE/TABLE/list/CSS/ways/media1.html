<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #a{
            width: 100%;
            height: 100vh;
            background-color: aqua;
        }
        @media screen and (min-height:0px) and (max-height:300px) {
            #a{
                background-color: green;
            }
        }
        @media screen and (min-height:301px) and (max-height:600px) {
            #a{
                background-color: rgb(32, 0, 128);
            }
        }
        @media screen and (min-height:601px) and (max-height:800px) {
            #a{
                background-color: rgb(128, 0, 87);
            }
        }
        @media screen and (min-height:800px) {
            #a{
                background-color: rgb(128, 2, 0);
            }
        }
       
    </style>
</head>
<body>
    <div id="a"></div>
</body>
</html>
