<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    #a {
        color: aqua;
    }
    #b {
        color: blueviolet;
    }
    .c {
        color: aqua;
        background-color: blueviolet;
    }
    div{
        color: tomato;
    }
    h3,h4,h5 {
        color: blueviolet;
    }
    #e,.f{
        color: rgb(12, 13, 32);
    }
   </style>
    
</head>
<body>
    <!-- id -->
    <h1 id="a">Lorem ipsum dolor sit amet.</h1>
    <h1 id="b">Lorem ipsum dolor sit amet.</h1>
    <!-- class -->
    <h2 class="c">Lorem ipsum dolor sit amet.</h2>
    <h2 class="c">Lorem ipsum dolor sit amet.</h2>
    <!-- tagname -->
     <div>Lorem ipsum dolor sit amet.</div>
     <!-- grouping -->
      <h3>Lorem ipsum dolor sit amet.</h3>
      <h4>Lorem ipsum dolor sit amet.</h4>
      <h5>Lorem ipsum dolor sit amet.</h5>
      <!-- chaining selector -->
       <h6 id="e" class="f">Lorem ipsum dolor sit amet.</h6>
</body>
</html>
