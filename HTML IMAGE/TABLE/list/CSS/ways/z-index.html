<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width: 400px;
            height: 400px;
            border: 2px solid red;
        }
        #a{
            width: 100px;
            height: 100px;
            background-color: blue;
            position: absolute;
            z-index: 2;
        }
        #b{
            width: 100px;
            height: 100px;
            background-color: brown;
            position: absolute;
            z-index: 1;
        }
        #c{
            width: 100px;
            height: 100px;
            background-color: aqua;
            position: absolute;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
    </div>
</body>
</html>
