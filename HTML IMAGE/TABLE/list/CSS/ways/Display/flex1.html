<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item{
            width: 100px;
            height: 100px;
            background-color: blue;
            border: 2px solid white;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 100px;
        }
        #flex-container{
            display: flex;
            /* flex-direction:  row; */
            justify-content: space-around;
            height: 100vh;
            /* align-items: stretch; */
            /* flex-wrap: wrap; */
            /* flex-flow: row wrap; */
            /* align-content: flex-start; */
            /* column-gap: 20px; */
            /* row-gap: 20px; */
            /* gap: 20px 40px; */
        }
        #item-1{
            order: 7;
        }
        #item-2{
            order: 5;
        }
        #item-3{
            font-size: 60px;
            flex-shrink: 2;
            flex-grow: 2;
            flex-basis: 200px;
            align-self: flex-start;
            order: 1;
            flex: 2 2 200px;

        }
        #item-4{
            order: 2;
        }
        #item-5{
            order: 3;
        }
        #item-6{
            order: 8;
        }
        #item-7{
            order: 4;
        }

    </style>
</head>
<body>
    <div id="flex-container">
        <div class="item" id="item-1">1</div>
        <div class="item" id="item-2">2</div>
        <div class="item" id="item-3">3</div>
        <div class="item" id="item-4">4</div>
        <div class="item" id="item-5">5</div>
        <div class="item" id="item-6">6</div>
        <div class="item" id="item-7">7</div>
        <div class="item" id="item-8">8</div>
    </div>
</body>
</html>
