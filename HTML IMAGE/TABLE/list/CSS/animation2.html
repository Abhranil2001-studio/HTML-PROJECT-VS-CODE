<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width: 100px;
            height: 100px;
            background-color: blue;
            animation: example2 2s linear 0.5s infinite both reverse;
        }
        body{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
        }
        @keyframes example2{
            from{
                transform: translateX(0px);
            }
            to{
                transform: translateX(500px);
            }
        }
    </style>
</head>
<body>
    <div id="main"></div>
</body>
</html>
