<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #a{
            width: 700px;
            height: 300px;
            background-color: goldenrod;
            margin-bottom: 20px;
            box-sizing: content-box;
            padding: 100px;
            border: 20px solid red;
        }
        #b{
            width: 700px;
            height: 300px;
            background-color: aqua;
            box-sizing: border-box;
            padding: 100px;
            border: 20px solid red;
        }
    </style>
</head>
<body>
    <div id="a"></div>
    <div id="b"></div>
</body>
</html>
